<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Básico de Pedidos e Entregas</title>
    <link rel="stylesheet" href="./smacss/base.css">
    <link rel="stylesheet" href="./smacss/portal.css">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <h1 class="app-title">Portal Básico de Pedidos e Entregas</h1>
            <p class="last-sync" id="last-sync">Atualizando...</p>
        </div>
    </header>

    <main class="container app-main">
        <section class="panel">
            <h2>Novo Pedido</h2>
            <form id="order-form" class="order-form">
                <div class="form-grid">
                    <label>
                        Cliente
                        <input type="text" name="cliente" required placeholder="Nome do cliente">
                    </label>
                    <label>
                        Produto
                        <input type="text" name="produto" required placeholder="Produto">
                    </label>
                    <label>
                        Prazo de entrega
                        <input type="date" name="prazoEntrega" required>
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit">Adicionar pedido</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>Pedidos</h2>
            <p id="summary" class="summary">Total: 0 | Pendentes: 0 | Entregues: 0</p>
            <div class="filters">
                <label>
                    Buscar
                    <input type="search" id="search-input" placeholder="Cliente, produto ou ID do pedido">
                </label>
                <label>
                    Status
                    <select id="status-filter">
                        <option value="todos">Todos</option>
                        <option value="pendente">Pendente</option>
                        <option value="em_rota">Em rota</option>
                        <option value="entregue">Entregue</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </label>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Produto</th>
                            <th>Prazo</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
